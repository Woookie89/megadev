services:
  db:
    image: postgres:17
    ports: ["5441:5432"]
    environment:
      POSTGRES_USER: stock5
      POSTGRES_PASSWORD: stock5
      POSTGRES_DB: reorder_zhbv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock5 -d reorder_zhbv"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
